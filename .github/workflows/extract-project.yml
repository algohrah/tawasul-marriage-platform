name: Build GitHub Pages preview

on:
  push:
    branches:
      - setup/initial-project
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static preview
        env:
          VITE_DATABASE_PROVIDER: local
        run: npx vite build --base=/tawasul-marriage-platform/
      - name: Support SPA routes
        run: cp dist/index.html dist/404.html
      - name: Publish preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
      - name: Enable GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
              -f build_type=legacy \
              -f 'source[branch]=gh-pages' \
              -f 'source[path]=/'
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
              -f 'source[branch]=gh-pages' \
              -f 'source[path]=/'
          fi
