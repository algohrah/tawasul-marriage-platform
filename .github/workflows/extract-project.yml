name: Build GitHub Pages preview

on:
  push:
    branches:
      - setup/initial-project
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare GitHub Pages build
        shell: bash
        run: |
          sed -i 's#<BrowserRouter>#<BrowserRouter basename={import.meta.env.BASE_URL}>#' src/App.tsx
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('index.html')
          html = path.read_text()
          html = re.sub(r'\s*<script data-arena-(?:recording|views)="true">.*?</script>', '', html, flags=re.S)
          path.write_text(html)
          PY
      - name: Build static preview
        env:
          VITE_DATABASE_PROVIDER: local
        run: npx vite build --base=/tawasul-marriage-platform/
      - name: Support SPA and cached mobile pages
        shell: bash
        run: |
          cp dist/index.html dist/404.html
          MAIN_JS="$(find dist/assets -maxdepth 1 -type f -name 'index-*.js' -size +100k | head -1)"
          test -n "$MAIN_JS"
          for LEGACY_JS in index-C4B9Z6iz.js index-C1b21DCR.js index-CLU0d74N.js; do
            if [ "$(basename "$MAIN_JS")" != "$LEGACY_JS" ]; then
              cp "$MAIN_JS" "dist/assets/$LEGACY_JS"
            fi
          done
      - name: Publish preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          keep_files: true
